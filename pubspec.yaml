publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado y DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegacion
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # Storage local
  shared_preferences: ^2.3.4

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
